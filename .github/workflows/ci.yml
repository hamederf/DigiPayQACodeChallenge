name: DigiPay E2E Tests

on:
  push:
    branches: ["main", "develop", "feature/**"]
  pull_request:
    branches: ["main", "develop"]
  workflow_dispatch:          # allow manual trigger from GitHub UI

jobs:
  e2e-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Python setup ───────────────────────────────────────────────────
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      # ── 3. Install dependencies ────────────────────────────────────────────
      - name: Install Python dependencies
        run: pip install -r requirements.txt

      # ── 4. Install Playwright / Chromium ──────────────────────────────────
      - name: Install Playwright browsers
        run: python -m Browser.entry init

      # ── 5. Create reports directory ────────────────────────────────────────
      - name: Prepare reports folder
        run: mkdir -p reports/screenshots

      # ── 6. Run login tests ─────────────────────────────────────────────────
      - name: Run login tests
        env:
          BASE_URL:                 ${{ secrets.BASE_URL }}
          DIGIPAY_PHONE:            ${{ secrets.DIGIPAY_PHONE }}
          DIGIPAY_OTP:              ${{ secrets.DIGIPAY_OTP }}
          HEADLESS:                 "true"
          BROWSER:                  "chromium"
        run: |
          robot \
            --outputdir reports \
            --output   output-login.xml \
            --log      log-login.html \
            --report   NONE \
            --loglevel INFO \
            tests/login.robot

      # ── 7. Run charge purchase tests ───────────────────────────────────────
      - name: Run charge purchase tests
        env:
          BASE_URL:                   ${{ secrets.BASE_URL }}
          DIGIPAY_PHONE:              ${{ secrets.DIGIPAY_PHONE }}
          DIGIPAY_OTP:                ${{ secrets.DIGIPAY_OTP }}
          CHARGE_PHONE_IRANCELL:      ${{ secrets.CHARGE_PHONE_IRANCELL }}
          CHARGE_PHONE_HAMRAHAVVAL:   ${{ secrets.CHARGE_PHONE_HAMRAHAVVAL }}
          HEADLESS:                   "true"
          BROWSER:                    "chromium"
        run: |
          robot \
            --outputdir reports \
            --output   output-charge.xml \
            --log      log-charge.html \
            --report   NONE \
            --loglevel INFO \
            tests/charge.robot

      # ── 8. Merge outputs & generate final report ───────────────────────────
      - name: Merge Robot outputs
        if: always()
        run: |
          rebot \
            --outputdir reports \
            --output   output.xml \
            --log      log.html \
            --report   report.html \
            reports/output-login.xml \
            reports/output-charge.xml

      # ── 9. Upload reports as artifact ──────────────────────────────────────
      - name: Upload test reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: robot-reports-${{ github.run_number }}
          path: reports/
          retention-days: 14
